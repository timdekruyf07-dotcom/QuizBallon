name: QuizBallon - Bouw Dieren V9

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quizballon-bouw-dieren
  cancel-in-progress: false

jobs:
  bouw-dieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Repository openen
        uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bronbestanden controleren
        shell: bash
        run: |
          test -f antwoorden/dieren.js
          test -f antwoorden/dieren-aanvulling.js
          test -f antwoorden/dieren-aanvulling-2.js

          node --check antwoorden/dieren.js
          node --check antwoorden/dieren-aanvulling.js
          node --check antwoorden/dieren-aanvulling-2.js

          echo "Alle drie de bronbestanden zijn aanwezig."

      - name: Database repareren, verwerken en controleren
        shell: bash
        run: |
          node <<'NODE'

          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const { performance } = require("node:perf_hooks");

          // ====================================================
          // INSTELLINGEN
          // ====================================================

          const VERSIE = "9.2.0";

          const UITVOERMAP =
            "antwoorden/gebouwd/dieren";

          const BASISLIJN = {
            versie: "9.1.0",
            uniekeDieren: 17123,
            antwoorden: 62945,
            raketten: 676,
            voortgang: 51.31,
            vragenMet1000: 14
          };

          const BRONBESTANDEN = [
            "antwoorden/dieren.js",
            "antwoorden/dieren-aanvulling.js",
            "antwoorden/dieren-aanvulling-2.js"
          ];

          const start = performance.now();

          const tijden = {};

          const reparaties = [];

          const fouten = [];

          const waarschuwingen = [];

          fs.mkdirSync("bouwrapport", {
            recursive: true
          });

          // ====================================================
          // HULPFUNCTIES
          // ====================================================

          function normaliseer(waarde) {
            return String(waarde ?? "")
              .trim()
              .toLowerCase()
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/ß/g, "ss")
              .replace(/æ/g, "ae")
              .replace(/œ/g, "oe")
              .replace(/[^a-z0-9]/g, "");
          }

          function aantalRaketten(aantal) {

            if (aantal <= 0) return 0;

            return Math.max(
              1,
              Math.ceil((aantal + 50) / 100)
            );

          }

          function rondAf(
            waarde,
            decimalen = 2
          ) {

            return Number(
              waarde.toFixed(decimalen)
            );

          }

          function seconden() {

            return rondAf(
              (performance.now() - start) / 1000,
              3
            );

          }

          function schrijfJSON(bestand, gegevens) {

            const inhoud =
              JSON.stringify(gegevens);

            fs.writeFileSync(
              bestand,
              inhoud,
              "utf8"
            );

            return Buffer.byteLength(
              inhoud,
              "utf8"
            );

          }

          function leesJSON(bestand) {

            return JSON.parse(
              fs.readFileSync(bestand, "utf8")
            );

          }

          // ====================================================
          // AUTOMATISCHE REPARATIE V9.2
          // ====================================================

          function vervangGecontroleerd(
            code,
            oud,
            nieuw,
            verwacht,
            omschrijving
          ) {

            const aantal =
              code.split(oud).length - 1;

            if (aantal !== verwacht) {

              throw new Error(
                `Reparatie niet uitgevoerd: ${omschrijving}. ` +
                `Verwacht ${verwacht} vindplaatsen, ` +
                `gevonden ${aantal}.`
              );

            }

            reparaties.push({
              omschrijving,
              aantal
            });

            console.log(
              `Reparatie: ${omschrijving} (${aantal}x)`
            );

            return code
              .split(oud)
              .join(nieuw);

          }

          function repareerAanvulling2(code) {

            console.log("");
            console.log(
              "Automatische reparatie V9.2 starten."
            );

            const markering =
              "  const eindStartV92 = Date.now();";

            const positie =
              code.indexOf(markering);

            if (
              positie === -1 ||
              positie !== code.lastIndexOf(markering)
            ) {

              throw new Error(
                "De eindverwerking van deel 8 is niet uniek gevonden."
              );

            }

            let inhoudelijkeDelen =
              code.slice(0, positie);

            let eindverwerking =
              code.slice(positie);

            // REPARATIE 1:
            // In delen 1 t/m 7 heten de aliassen
            // van oorspronkelijke dierrecords
            // daadwerkelijk "aliases".

            inhoudelijkeDelen =
              vervangGecontroleerd(
                inhoudelijkeDelen,
                "record.synoniemen || []",
                "record.aliases || []",
                5,
                "Aliassen in inhoudelijke delen herstellen"
              );

            // REPARATIE 2:
            // Een Map bevat vraagnummer en punten.
            // Alleen de sleutels zijn vraagnummers.

            eindverwerking =
              vervangGecontroleerd(
                eindverwerking,
                "for (const waarde of record.vragen || [])",
                "for (const waarde of record.vragen.keys())",
                1,
                "Vraagnummers correct uitlezen"
              );

            // REPARATIE 3:
            // Bestaande synoniemen behouden bij export.

            eindverwerking =
              vervangGecontroleerd(
                eindverwerking,
                "record.synoniemen || []",
                "record.aliases || []",
                1,
                "Synoniemen bij export herstellen"
              );

            // REPARATIE 4:
            // De oorspronkelijke punten staan
            // in record.vragen.

            eindverwerking =
              vervangGecontroleerd(
                eindverwerking,
                "record.puntenPerVraag,",
                "record.vragen,\n      record.puntenPerVraag,",
                1,
                "Opgeslagen punten correct uitlezen"
              );

            // REPARATIE 5:
            // De daadwerkelijke naam van de watertests
            // uit deel 2 toevoegen.

            eindverwerking =
              vervangGecontroleerd(
                eindverwerking,
                '"extraMeerTestsDeel2",',
                '"extraWaterTestsDeel2",\n        "extraMeerTestsDeel2",',
                1,
                "Ontbrekende watertests herstellen"
              );

            const gerepareerdeCode =
              inhoudelijkeDelen +
              eindverwerking;

            console.log(
              "Alle automatische reparaties toegepast."
            );

            return gerepareerdeCode;

          }

          // ====================================================
          // JAVASCRIPT-OMGEVING
          // ====================================================

          const stilConsole = {
            log() {},
            info() {},
            debug() {},
            table() {},
            group() {},
            groupCollapsed() {},
            groupEnd() {},
            time() {},
            timeEnd() {},
            warn() {},
            error() {}
          };

          const context = vm.createContext({
            console: stilConsole,
            performance
          });

          context.window = context;
          context.self = context;

          // ====================================================
          // BRONBESTAND LADEN
          // ====================================================

          function laadBestand(bestand) {

            console.log("");
            console.log(`Verwerken: ${bestand}`);

            const bestandStart =
              performance.now();

            let code = fs.readFileSync(
              bestand,
              "utf8"
            );

            if (
              bestand ===
              "antwoorden/dieren-aanvulling-2.js"
            ) {

              code = repareerAanvulling2(code);

            }

            try {

              const script =
                new vm.Script(code, {
                  filename: bestand
                });

              script.runInContext(
                context,
                {
                  timeout: 1200000
                }
              );

            } catch (fout) {

              console.error(
                `Fout in ${bestand}:`
              );

              console.error(
                fout.stack || fout.message
              );

              throw fout;

            }

            tijden[bestand] = rondAf(
              (
                performance.now() -
                bestandStart
              ) / 1000,
              3
            );

            console.log(
              `Verwerkt in ${tijden[bestand]} seconden.`
            );

            const categorie =
              context.QB_V9_CATEGORIEEN?.Dieren;

            if (categorie) {

              console.log(
                `Versie: ${categorie.version}`
              );

              console.log(
                `Dierrecords: ${
                  categorie.summary?.bruikbareDierrecords ??
                  "Onbekend"
                }`
              );

              console.log(
                `Antwoordkoppelingen: ${
                  categorie.summary?.totaalVraagAntwoorden ??
                  "Onbekend"
                }`
              );

            }

          }

          // ====================================================
          // DEBUGLIJSTEN UITLEZEN
          // ====================================================

          function leesDebug(
            debug,
            naam,
            verplicht = false
          ) {

            try {

              if (
                typeof debug?.[naam] !== "function"
              ) {

                throw new Error(
                  "Functie ontbreekt."
                );

              }

              const resultaat =
                debug[naam]();

              if (!Array.isArray(resultaat)) {

                throw new Error(
                  "Resultaat is geen lijst."
                );

              }

              return JSON.parse(
                JSON.stringify(resultaat)
              );

            } catch (fout) {

              const melding =
                `${naam}: ${fout.message}`;

              if (verplicht) {

                fouten.push(melding);

              } else {

                waarschuwingen.push(melding);

              }

              return [];

            }

          }

          // ====================================================
          // TESTRESULTATEN VERWERKEN
          // ====================================================

          function controleerTests(naam, tests) {

            if (tests.length === 0) {

              fouten.push(
                `${naam}: geen tests uitgevoerd.`
              );

            }

            const mislukt =
              tests.filter(
                test => test.geslaagd !== true
              );

            const geslaagd =
              tests.length - mislukt.length;

            console.log(
              `${naam}: ${geslaagd}/${tests.length}`
            );

            for (const test of mislukt) {

              fouten.push(
                `${naam}: ${JSON.stringify(test)}`
              );

            }

            return {
              geslaagd,
              totaal: tests.length,
              mislukt
            };

          }

          // ====================================================
          // HOOFDPROGRAMMA
          // ====================================================

          function bouwen() {

            console.log(
              "=========================================="
            );

            console.log(
              "QUIZBALLON V9.2 - GEREPAREERDE BOUW"
            );

            console.log(
              "=========================================="
            );

            // Eerst de bestaande werkende versie.

            laadBestand(BRONBESTANDEN[0]);

            laadBestand(BRONBESTANDEN[1]);

            const basis =
              context.QB_V9_CATEGORIEEN?.Dieren;

            if (
              !basis ||
              basis.version !== "9.1.0"
            ) {

              throw new Error(
                "De oorspronkelijke V9.1-database ontbreekt."
              );

            }

            if (
              basis.summary?.totaalVraagAntwoorden !==
              BASISLIJN.antwoorden
            ) {

              throw new Error(
                "De V9.1-basis komt niet overeen met de bekende database."
              );

            }

            if (
              basis.summary?.bruikbareDierrecords !==
              BASISLIJN.uniekeDieren
            ) {

              throw new Error(
                "Het aantal oorspronkelijke dierrecords klopt niet."
              );

            }

            // Daarna de gerepareerde uitbreiding.

            laadBestand(BRONBESTANDEN[2]);

            const categorie =
              context.QB_V9_CATEGORIEEN?.Dieren;

            const debug =
              context.QB_V9_DIeren_DEBUG;

            if (
              !categorie ||
              categorie.version !== VERSIE
            ) {

              throw new Error(
                "De definitieve V9.2-export ontbreekt."
              );

            }

            if (!debug) {

              throw new Error(
                "De V9.2-debugfuncties ontbreken."
              );

            }

            if (
              !Array.isArray(categorie.questions)
            ) {

              throw new Error(
                "De vragenlijst ontbreekt."
              );

            }

            const vragen = JSON.parse(
              JSON.stringify(categorie.questions)
            );

            vragen.sort(
              (a, b) =>
                a.questionNumber -
                b.questionNumber
            );

            // ==================================================
            // ONAFHANKELIJKE STRUCTUURCONTROLE
            // ==================================================

            if (vragen.length !== 50) {

              fouten.push(
                `Verwacht 50 vragen, gevonden ${vragen.length}.`
              );

            }

            const uniekeDieren =
              new Set();

            const vraagIds =
              new Set();

            const vraagnummers =
              new Set();

            const vraagRapport = [];

            let totaalAntwoorden = 0;

            let totaalRaketten = 0;

            let totaalAliassen = 0;

            let vragenMet1000 = 0;

            let begrensdeVoortgang = 0;

            let ontbrekendTotStreefdoel = 0;

            for (const vraag of vragen) {

              const nummer =
                vraag.questionNumber;

              if (
                !Number.isInteger(nummer) ||
                nummer < 1 ||
                nummer > 50
              ) {

                fouten.push(
                  `Ongeldig vraagnummer: ${nummer}`
                );

                continue;

              }

              if (
                vraagnummers.has(nummer)
              ) {

                fouten.push(
                  `Dubbel vraagnummer: ${nummer}`
                );

              }

              vraagnummers.add(nummer);

              if (
                typeof vraag.id !== "string" ||
                !vraag.id.trim()
              ) {

                fouten.push(
                  `Vraag ${nummer} heeft geen geldige ID.`
                );

              }

              if (vraagIds.has(vraag.id)) {

                fouten.push(
                  `Dubbele vraag-ID: ${vraag.id}`
                );

              }

              vraagIds.add(vraag.id);

              if (
                typeof vraag.question !== "string" ||
                !vraag.question.trim()
              ) {

                fouten.push(
                  `Vraag ${nummer} heeft geen vraagtekst.`
                );

              }

              const antwoorden =
                Array.isArray(vraag.answers)
                  ? vraag.answers
                  : [];

              if (antwoorden.length === 0) {

                fouten.push(
                  `Vraag ${nummer} heeft geen antwoorden.`
                );

              }

              const gezien =
                new Set();

              let raketten = 0;

              for (const antwoord of antwoorden) {

                const naam =
                  antwoord.answer;

                const sleutel =
                  normaliseer(naam);

                if (
                  typeof naam !== "string" ||
                  !sleutel
                ) {

                  fouten.push(
                    `Vraag ${nummer}: lege diernaam.`
                  );

                  continue;

                }

                if (gezien.has(sleutel)) {

                  fouten.push(
                    `Vraag ${nummer}: dubbel antwoord ${naam}.`
                  );

                }

                gezien.add(sleutel);

                uniekeDieren.add(sleutel);

                if (
                  !Number.isInteger(antwoord.points) ||
                  antwoord.points < 10 ||
                  antwoord.points > 100
                ) {

                  fouten.push(
                    `Vraag ${nummer}: ongeldige punten bij ${naam}.`
                  );

                }

                if (
                  antwoord.isRocket !==
                  (antwoord.points === 100)
                ) {

                  fouten.push(
                    `Vraag ${nummer}: onjuiste raketstatus bij ${naam}.`
                  );

                }

                if (antwoord.isRocket) {

                  raketten++;

                }

                if (
                  !Array.isArray(antwoord.aliases)
                ) {

                  fouten.push(
                    `Vraag ${nummer}: ongeldige aliassen bij ${naam}.`
                  );

                } else {

                  const aliasSleutels =
                    new Set([sleutel]);

                  for (
                    const alias of antwoord.aliases
                  ) {

                    const aliasSleutel =
                      normaliseer(alias);

                    if (
                      typeof alias !== "string" ||
                      !aliasSleutel
                    ) {

                      fouten.push(
                        `Vraag ${nummer}: ongeldige alias bij ${naam}.`
                      );

                      continue;

                    }

                    if (
                      aliasSleutels.has(aliasSleutel)
                    ) {

                      fouten.push(
                        `Vraag ${nummer}: dubbele alias bij ${naam}.`
                      );

                    }

                    aliasSleutels.add(aliasSleutel);

                  }

                  totaalAliassen +=
                    antwoord.aliases.length;

                }

              }

              const aantal =
                antwoorden.length;

              const verwacht =
                aantalRaketten(aantal);

              if (raketten !== verwacht) {

                fouten.push(
                  `Vraag ${nummer}: ${raketten} raketten ` +
                  `in plaats van ${verwacht}.`
                );

              }

              if (
                vraag.answerCount !== aantal
              ) {

                fouten.push(
                  `Vraag ${nummer}: answerCount klopt niet.`
                );

              }

              if (
                vraag.rocketCount !== raketten
              ) {

                fouten.push(
                  `Vraag ${nummer}: rocketCount klopt niet.`
                );

              }

              totaalAntwoorden += aantal;

              totaalRaketten += raketten;

              begrensdeVoortgang +=
                Math.min(aantal, 1000);

              ontbrekendTotStreefdoel +=
                Math.max(0, 1000 - aantal);

              if (aantal >= 1000) {

                vragenMet1000++;

              }

              vraagRapport.push({
                vraag: nummer,
                vraagtekst: vraag.question,
                antwoorden: aantal,
                raketten,
                tekort: Math.max(0, 1000 - aantal)
              });

              console.log(
                `Vraag ${String(nummer).padStart(2, "0")}: ` +
                `${aantal} antwoorden, ${raketten} raketten.`
              );

            }

            for (
              let nummer = 1;
              nummer <= 50;
              nummer++
            ) {

              if (!vraagnummers.has(nummer)) {

                fouten.push(
                  `Vraag ${nummer} ontbreekt.`
                );

              }

            }

            // ==================================================
            // EXTRA BESCHERMING TEGEN LEGE EXPORT
            // ==================================================

            if (
              totaalAntwoorden <= BASISLIJN.antwoorden
            ) {

              fouten.push(
                "De uitbreiding bevat niet meer antwoordkoppelingen dan V9.1."
              );

            }

            if (
              uniekeDieren.size <= BASISLIJN.uniekeDieren
            ) {

              fouten.push(
                "De uitbreiding bevat niet meer dierrecords dan V9.1."
              );

            }

            // ==================================================
            // ALLE TESTEN OPHALEN
            // ==================================================

            const tests =
              leesDebug(debug, "tests", true);

            const raketTests =
              leesDebug(debug, "raketTests", true);

            const letterTests =
              leesDebug(debug, "letterTests", true);

            const letterBankTests =
              leesDebug(debug, "letterBankTests", true);

            const exportFouten =
              leesDebug(debug, "fouten", true);

            const naamconflicten =
              leesDebug(debug, "naamconflicten");

            const ontbrekendeNamen =
              leesDebug(debug, "ontbrekendeNamen");

            const ontbrekendeKoppelingen =
              leesDebug(debug, "ontbrekendeKoppelingen");

            const overgeslagenConflicten =
              leesDebug(debug, "overgeslagenConflicten");

            const dubbeleNamen =
              leesDebug(debug, "dubbeleNamen");

            const bronWaarschuwingen =
              leesDebug(debug, "waarschuwingen");

            console.log("");
            console.log(
              "=========================================="
            );

            console.log("TESTRESULTATEN");

            console.log(
              "=========================================="
            );

            const antwoordResultaat =
              controleerTests(
                "Antwoordtests",
                tests
              );

            const raketResultaat =
              controleerTests(
                "Rakettests",
                raketTests
              );

            const letterResultaat =
              controleerTests(
                "Lettertests",
                letterTests
              );

            const letterBankResultaat =
              controleerTests(
                "Letterbanktests",
                letterBankTests
              );

            // ==================================================
            // ONAFHANKELIJKE ANTWOORDTESTS
            // ==================================================

            const indexPerVraag =
              new Map();

            for (const vraag of vragen) {

              const namen =
                new Set();

              for (
                const antwoord of vraag.answers || []
              ) {

                namen.add(
                  normaliseer(antwoord.answer)
                );

                for (
                  const alias of antwoord.aliases || []
                ) {

                  namen.add(
                    normaliseer(alias)
                  );

                }

              }

              indexPerVraag.set(
                vraag.questionNumber,
                namen
              );

            }

            const onafhankelijkeTests = [];

            for (const test of tests) {

              const resultaat =
                indexPerVraag
                  .get(Number(test.nummer))
                  ?.has(normaliseer(test.invoer)) ||
                false;

              const geslaagd =
                resultaat === test.verwacht;

              onafhankelijkeTests.push({
                nummer: test.nummer,
                invoer: test.invoer,
                verwacht: test.verwacht,
                resultaat,
                geslaagd
              });

              if (!geslaagd) {

                fouten.push(
                  `Onafhankelijke antwoordtest: ` +
                  `vraag ${test.nummer}, ${test.invoer}.`
                );

              }

            }

            const onafhankelijkeTestsGeslaagd =
              onafhankelijkeTests.filter(
                test => test.geslaagd
              ).length;

            console.log(
              `Onafhankelijke antwoordtests: ` +
              `${onafhankelijkeTestsGeslaagd}/${onafhankelijkeTests.length}`
            );

            // ==================================================
            // RAKETFORMULE ONAFHANKELIJK TESTEN
            // ==================================================

            const extraRaketTests = [
              [0,0],
              [1,1],
              [50,1],
              [51,2],
              [150,2],
              [151,3],
              [250,3],
              [251,4],
              [350,4],
              [351,5],
              [950,10],
              [951,11],
              [1000,11],
              [1050,11],
              [1051,12],
              [5000,51],
              [10000,101]
            ];

            for (
              const [aantal, verwacht] of
              extraRaketTests
            ) {

              if (
                aantalRaketten(aantal) !== verwacht
              ) {

                fouten.push(
                  `Onafhankelijke rakettest mislukt bij ${aantal}.`
                );

              }

            }

            // ==================================================
            // SAMENVATTING CONTROLEREN
            // ==================================================

            const bronSamenvatting =
              categorie.summary || {};

            const vergelijkingen = [
              [
                "Bruikbare dierrecords",
                bronSamenvatting.bruikbareDierrecords,
                uniekeDieren.size
              ],
              [
                "Antwoordkoppelingen",
                bronSamenvatting.totaalVraagAntwoorden,
                totaalAntwoorden
              ],
              [
                "Raketten",
                bronSamenvatting.totaalRaketten,
                totaalRaketten
              ],
              [
                "Aantal vragen",
                bronSamenvatting.totaalVragen,
                vragen.length
              ],
              [
                "Vragen met 1000 antwoorden",
                bronSamenvatting.vragenMet1000Antwoorden,
                vragenMet1000
              ]
            ];

            for (
              const [naam, verwacht, gevonden] of
              vergelijkingen
            ) {

              if (verwacht !== gevonden) {

                fouten.push(
                  `${naam}: verwacht ${verwacht}, gevonden ${gevonden}.`
                );

              }

            }

            for (const fout of exportFouten) {

              fouten.push(
                typeof fout === "string"
                  ? fout
                  : JSON.stringify(fout)
              );

            }

            for (const waarschuwing of bronWaarschuwingen) {

              waarschuwingen.push(
                typeof waarschuwing === "string"
                  ? waarschuwing
                  : JSON.stringify(waarschuwing)
              );

            }

            if (
              categorie.technicallyReady !== true
            ) {

              fouten.push(
                "V9.2 meldt dat nog niet alle controles zijn geslaagd."
              );

            }

            // ==================================================
            // DEFINITIEVE STATISTIEKEN
            // ==================================================

            const voortgang = rondAf(
              begrensdeVoortgang / 50000 * 100
            );

            const statistieken = {

              uniqueAnimals:
                uniekeDieren.size,

              questionCount:
                vragen.length,

              answerCount:
                totaalAntwoorden,

              rocketCount:
                totaalRaketten,

              aliasLinks:
                totaalAliassen,

              completedQuestions:
                vragenMet1000,

              incompleteQuestions:
                50 - vragenMet1000,

              progress:
                voortgang,

              missingToTarget:
                ontbrekendTotStreefdoel,

              passedTests:
                antwoordResultaat.geslaagd,

              totalTests:
                antwoordResultaat.totaal,

              passedRocketTests:
                raketResultaat.geslaagd,

              totalRocketTests:
                raketResultaat.totaal,

              passedLetterTests:
                letterResultaat.geslaagd,

              totalLetterTests:
                letterResultaat.totaal,

              passedLetterBankTests:
                letterBankResultaat.geslaagd,

              totalLetterBankTests:
                letterBankResultaat.totaal,

              passedIndependentTests:
                onafhankelijkeTestsGeslaagd,

              totalIndependentTests:
                onafhankelijkeTests.length,

              conflicts:
                naamconflicten.length,

              warnings:
                waarschuwingen.length,

              newAnimals:
                uniekeDieren.size -
                BASISLIJN.uniekeDieren,

              newAnswerLinks:
                totaalAntwoorden -
                BASISLIJN.antwoorden,

              newRockets:
                totaalRaketten -
                BASISLIJN.raketten,

              progressDifference:
                rondAf(
                  voortgang -
                  BASISLIJN.voortgang
                )

            };

            // ==================================================
            // BOUWRAPPORT
            // ==================================================

            const controleRapport = {

              version: VERSIE,

              category: "Dieren",

              baseline: BASISLIJN,

              repairs: reparaties,

              timings: tijden,

              summary: statistieken,

              sourceSummary:
                bronSamenvatting,

              tests,

              rocketTests:
                raketTests,

              letterTests,

              letterBankTests,

              independentTests:
                onafhankelijkeTests,

              failedTests:
                antwoordResultaat.mislukt,

              failedRocketTests:
                raketResultaat.mislukt,

              failedLetterTests:
                letterResultaat.mislukt,

              failedLetterBankTests:
                letterBankResultaat.mislukt,

              missingNames:
                ontbrekendeNamen,

              missingLinks:
                ontbrekendeKoppelingen,

              conflicts:
                naamconflicten,

              skippedConflicts:
                overgeslagenConflicten,

              duplicateNames:
                dubbeleNamen,

              warnings:
                waarschuwingen,

              exportErrors:
                [...new Set(fouten)],

              questions:
                vraagRapport,

              contentVerified: false,

              contentComplete: false,

              buildVerified: false,

              totalBuildSeconds:
                seconden()

            };

            schrijfJSON(
              "bouwrapport/controle.json",
              controleRapport
            );

            // ==================================================
            // RESULTATEN TONEN
            // ==================================================

            console.log("");
            console.log(
              "=========================================="
            );

            console.log(
              "QUIZBALLON V9.2 - RESULTATEN"
            );

            console.log(
              "=========================================="
            );

            console.log(
              `Unieke diernamen: ${uniekeDieren.size}`
            );

            console.log(
              `Nieuwe diernamen: ${statistieken.newAnimals}`
            );

            console.log(
              `Antwoordkoppelingen: ${totaalAntwoorden}`
            );

            console.log(
              `Nieuwe antwoordkoppelingen: ${statistieken.newAnswerLinks}`
            );

            console.log(
              `Raketten: ${totaalRaketten}`
            );

            console.log(
              `Vragen met 1000+ antwoorden: ${vragenMet1000}/50`
            );

            console.log(
              `Voortgang: ${voortgang}%`
            );

            console.log(
              `Ontbrekend tot streefdoel: ${ontbrekendTotStreefdoel}`
            );

            console.log(
              `Naamconflicten: ${naamconflicten.length}`
            );

            console.log(
              `Waarschuwingen: ${waarschuwingen.length}`
            );

            console.log(
              `Technische fouten: ${controleRapport.exportErrors.length}`
            );

            // ==================================================
            // GITHUB SAMENVATTING
            // ==================================================

            if (process.env.GITHUB_STEP_SUMMARY) {

              const regels = [
                "# QuizBallon Dieren V9.2",
                "",
                "Automatische reparatie toegepast.",
                "",
                "| Onderdeel | V9.1 | V9.2 |",
                "|---|---:|---:|",
                `| Diernamen | 17123 | ${uniekeDieren.size} |`,
                `| Antwoorden | 62945 | ${totaalAntwoorden} |`,
                `| Raketten | 676 | ${totaalRaketten} |`,
                `| Vragen met 1000+ | 14 | ${vragenMet1000} |`,
                `| Voortgang | 51.31% | ${voortgang}% |`,
                "",
                "## Testresultaten",
                "",
                `- Antwoordtests: ${antwoordResultaat.geslaagd}/${antwoordResultaat.totaal}`,
                `- Rakettests: ${raketResultaat.geslaagd}/${raketResultaat.totaal}`,
                `- Lettertests: ${letterResultaat.geslaagd}/${letterResultaat.totaal}`,
                `- Letterbanktests: ${letterBankResultaat.geslaagd}/${letterBankResultaat.totaal}`,
                `- Onafhankelijke antwoordtests: ${onafhankelijkeTestsGeslaagd}/${onafhankelijkeTests.length}`,
                `- Technische fouten: ${controleRapport.exportErrors.length}`,
                "",
                "## Alle 50 vragen",
                "",
                "| Vraag | Antwoorden | Raketten | Tekort |",
                "|---:|---:|---:|---:|"
              ];

              for (const vraag of vraagRapport) {

                regels.push(
                  `| ${vraag.vraag} | ${vraag.antwoorden} | ${vraag.raketten} | ${vraag.tekort} |`
                );

              }

              regels.push(
                "",
                "## Mislukte antwoordtests",
                ""
              );

              if (
                antwoordResultaat.mislukt.length === 0
              ) {

                regels.push(
                  "Geen mislukte antwoordtests."
                );

              } else {

                for (
                  const test of
                  antwoordResultaat.mislukt
                ) {

                  regels.push(
                    `- Vraag ${test.nummer}: ${test.invoer}. ` +
                    `Verwacht: ${test.verwacht}. ` +
                    `Gevonden: ${test.resultaat}.`
                  );

                }

              }

              regels.push(
                "",
                "Biologische volledigheid is niet onafhankelijk vastgesteld."
              );

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                regels.join("\n") + "\n"
              );

            }

            // ==================================================
            // BIJ FOUTEN NIET PUBLICEREN
            // ==================================================

            if (
              controleRapport.exportErrors.length > 0
            ) {

              console.error("");
              console.error(
                "V9.2 heeft nog niet alle controles doorstaan."
              );

              for (
                const fout of
                controleRapport.exportErrors.slice(0, 100)
              ) {

                console.error(`- ${fout}`);

              }

              console.error(
                "De volledige foutlijst staat in het bouwrapport."
              );

              console.error(
                "De werkende V9.1-bestanden worden niet vervangen."
              );

              throw new Error(
                `${controleRapport.exportErrors.length} controles mislukt.`
              );

            }

            // ==================================================
            // JSON-VRAAGBESTANDEN GENEREREN
            // ==================================================

            fs.mkdirSync(
              UITVOERMAP,
              {
                recursive: true
              }
            );

            const manifestVragen = [];

            let totaalBytes = 0;

            for (const vraag of vragen) {

              const bestandsnaam =
                String(vraag.questionNumber)
                  .padStart(2, "0") +
                ".json";

              const bestand =
                path.join(
                  UITVOERMAP,
                  bestandsnaam
                );

              const bytes =
                schrijfJSON(
                  bestand,
                  vraag
                );

              totaalBytes += bytes;

              manifestVragen.push({

                id: vraag.id,

                baseQuestionId:
                  vraag.baseQuestionId ||
                  vraag.id,

                topicId:
                  vraag.topicId ||
                  vraag.id,

                questionNumber:
                  vraag.questionNumber,

                question:
                  vraag.question,

                category:
                  vraag.category,

                qb650Category:
                  "Dieren",

                hint:
                  vraag.hint || "",

                answerCount:
                  vraag.answers.length,

                rocketCount:
                  vraag.rocketCount,

                file:
                  bestandsnaam,

                bytes

              });

              console.log(
                `${bestandsnaam}: ` +
                `${vraag.answers.length} antwoorden, ` +
                `${rondAf(bytes / 1024, 1)} KB`
              );

            }

            // ==================================================
            // MANIFEST
            // ==================================================

            const manifest = {

              version:
                VERSIE,

              category:
                "Dieren",

              contentVerified:
                false,

              contentComplete:
                false,

              buildVerified:
                true,

              summary: {

                ...statistieken,

                totalBytes:
                  totaalBytes,

                averageQuestionBytes:
                  Math.round(
                    totaalBytes / vragen.length
                  )

              },

              questions:
                manifestVragen

            };

            schrijfJSON(
              path.join(
                UITVOERMAP,
                "manifest.json"
              ),
              manifest
            );

            // ==================================================
            // GEGENEREERDE BESTANDEN CONTROLEREN
            // ==================================================

            const controleManifest =
              leesJSON(
                path.join(
                  UITVOERMAP,
                  "manifest.json"
                )
              );

            if (
              controleManifest.version !== VERSIE ||
              controleManifest.questions.length !== 50
            ) {

              throw new Error(
                "Het gegenereerde manifest klopt niet."
              );

            }

            let controleAntwoorden = 0;

            let controleRaketten = 0;

            let controleBytes = 0;

            const controleDieren =
              new Set();

            for (
              const metadata of
              controleManifest.questions
            ) {

              const bestand =
                path.join(
                  UITVOERMAP,
                  metadata.file
                );

              const vraag =
                leesJSON(bestand);

              const bytes =
                fs.statSync(bestand).size;

              if (
                vraag.id !== metadata.id ||
                vraag.questionNumber !== metadata.questionNumber ||
                vraag.dataVersion !== VERSIE
              ) {

                throw new Error(
                  `Vraaggegevens kloppen niet in ${metadata.file}.`
                );

              }

              if (
                vraag.answers.length !== metadata.answerCount
              ) {

                throw new Error(
                  `Antwoordaantal klopt niet in ${metadata.file}.`
                );

              }

              const raketten =
                vraag.answers.filter(
                  antwoord => antwoord.isRocket
                ).length;

              if (
                raketten !== metadata.rocketCount
              ) {

                throw new Error(
                  `Raketaantal klopt niet in ${metadata.file}.`
                );

              }

              if (bytes !== metadata.bytes) {

                throw new Error(
                  `Bestandsgrootte klopt niet in ${metadata.file}.`
                );

              }

              controleAntwoorden +=
                vraag.answers.length;

              controleRaketten +=
                raketten;

              controleBytes +=
                bytes;

              for (
                const antwoord of vraag.answers
              ) {

                controleDieren.add(
                  normaliseer(antwoord.answer)
                );

              }

            }

            if (
              controleAntwoorden !== totaalAntwoorden ||
              controleRaketten !== totaalRaketten ||
              controleBytes !== totaalBytes ||
              controleDieren.size !== uniekeDieren.size
            ) {

              throw new Error(
                "Gegevens verloren gegaan tijdens de JSON-export."
              );

            }

            // ==================================================
            // DEFINITIEF CONTROLERAPPORT
            // ==================================================

            controleRapport.summary =
              manifest.summary;

            controleRapport.buildVerified =
              true;

            controleRapport.totalBuildSeconds =
              seconden();

            controleRapport.exportErrors =
              [];

            schrijfJSON(
              path.join(
                UITVOERMAP,
                "controle.json"
              ),
              controleRapport
            );

            schrijfJSON(
              "bouwrapport/controle.json",
              controleRapport
            );

            // ==================================================
            // SUCCESMELDING
            // ==================================================

            console.log("");
            console.log(
              "=========================================="
            );

            console.log(
              "QUIZBALLON V9.2 SUCCESVOL GEBOUWD"
            );

            console.log(
              "=========================================="
            );

            console.log(
              `Versie: ${VERSIE}`
            );

            console.log(
              `Diernamen: ${uniekeDieren.size}`
            );

            console.log(
              `Antwoordkoppelingen: ${totaalAntwoorden}`
            );

            console.log(
              `Raketten: ${totaalRaketten}`
            );

            console.log(
              `JSON-grootte: ${rondAf(totaalBytes / 1024 / 1024)} MB`
            );

            console.log(
              `Voortgang: ${voortgang}%`
            );

            console.log(
              `Bouwtijd: ${seconden()} seconden`
            );

            console.log(
              "Technisch gereed: Ja"
            );

            console.log(
              "Biologisch onafhankelijk gecontroleerd: Nee"
            );

          }

          // ====================================================
          // BOUW UITVOEREN
          // ====================================================

          try {

            bouwen();

          } catch (fout) {

            const rapportBestand =
              "bouwrapport/controle.json";

            let rapport = {};

            if (
              fs.existsSync(rapportBestand)
            ) {

              try {

                rapport =
                  leesJSON(rapportBestand);

              } catch {}

            }

            rapport.version = VERSIE;

            rapport.buildVerified = false;

            rapport.repairs = reparaties;

            rapport.timings = tijden;

            rapport.fatalError = {
              message: fout.message,
              stack: fout.stack
            };

            rapport.totalBuildSeconds =
              seconden();

            schrijfJSON(
              rapportBestand,
              rapport
            );

            console.error(
              fout.stack || fout.message
            );

            process.exitCode = 1;

          }

          NODE

      - name: Bouwrapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizballon-dieren-v92-bouwrapport
          path: bouwrapport/
          if-no-files-found: warn
          retention-days: 14

      - name: Gegenereerde bestanden controleren
        shell: bash
        run: |
          test -f antwoorden/gebouwd/dieren/manifest.json
          test -f antwoorden/gebouwd/dieren/controle.json

          for nummer in $(seq -w 1 50); do
            test -f "antwoorden/gebouwd/dieren/${nummer}.json"
          done

          echo "Alle 52 vereiste JSON-bestanden aanwezig."

          du -sh antwoorden/gebouwd/dieren/

      - name: Gegenereerde bestanden opslaan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add antwoorden/gebouwd/dieren/

          if git diff --cached --quiet; then

            echo "Geen gewijzigde bestanden."

          else

            git commit -m "Bouw gerepareerde QuizBallon Dieren V9.2 database"

            git push

          fi

      - name: Bouwproces afgerond
        shell: bash
        run: |
          echo "=========================================="
          echo "QUIZBALLON DIEREN V9.2 IS GEBOUWD"
          echo "=========================================="
          echo ""
          echo "De automatische reparatie is toegepast."
          echo "50 afzonderlijke vraagbanken."
          echo "1 manifestbestand."
          echo "1 controlerapport."
          echo ""
          echo "De oorspronkelijke dierenbestanden zijn niet gewijzigd."
          echo "De snelle laadstructuur blijft behouden."
          echo "De actieve V8-game is niet gewijzigd."
          echo ""
          echo "Testpagina:"
          echo "https://timdekruyf07-dotcom.github.io/QuizBallon/test-dieren-snel.html"
