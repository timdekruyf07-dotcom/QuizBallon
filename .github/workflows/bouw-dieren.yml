name: QuizBallon - Bouw Dieren V9

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quizballon-bouw-dieren
  cancel-in-progress: false

jobs:
  bouw-dieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ========================================================
      # REPOSITORY OPENEN
      # ========================================================

      - name: Repository openen
        uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================================================
      # BRONBESTANDEN CONTROLEREN
      # ========================================================

      - name: Bronbestanden controleren
        shell: bash
        run: |
          echo "QuizBallon V9.2 - Bronbestanden controleren"

          test -f antwoorden/dieren.js
          test -f antwoorden/dieren-aanvulling.js
          test -f antwoorden/dieren-aanvulling-2.js

          echo ""
          echo "Alle drie de dierenbestanden zijn aanwezig."

          ls -lh antwoorden/dieren.js
          ls -lh antwoorden/dieren-aanvulling.js
          ls -lh antwoorden/dieren-aanvulling-2.js

      # ========================================================
      # JAVASCRIPT-SYNTAX CONTROLEREN
      # ========================================================

      - name: JavaScript-syntax controleren
        shell: bash
        run: |
          node --check antwoorden/dieren.js
          node --check antwoorden/dieren-aanvulling.js
          node --check antwoorden/dieren-aanvulling-2.js

          echo "Alle drie de bestanden zijn syntactisch geldig."

      # ========================================================
      # DATABASE VERWERKEN
      # ========================================================

      - name: Database verwerken en controleren
        shell: bash
        run: |
          node <<'NODE'

          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");
          const { performance } = require("node:perf_hooks");

          // ====================================================
          // INSTELLINGEN
          // ====================================================

          const VERWACHTE_VERSIE = "9.2.0";

          const UITVOERMAP = path.join(
            "antwoorden",
            "gebouwd",
            "dieren"
          );

          const BRONBESTANDEN = [
            "antwoorden/dieren.js",
            "antwoorden/dieren-aanvulling.js",
            "antwoorden/dieren-aanvulling-2.js"
          ];

          const BASISLIJN = {
            versie: "9.1.0",
            uniekeDieren: 17123,
            antwoorden: 62945,
            raketten: 676,
            voortgang: 51.31,
            vragenMet1000: 14
          };

          const bouwStart = performance.now();

          const tijden = {};

          const fouten = [];

          const waarschuwingen = [];

          // ====================================================
          // HULPFUNCTIES
          // ====================================================

          function normaliseer(waarde) {
            return String(waarde ?? "")
              .trim()
              .toLowerCase()
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .replace(/ß/g, "ss")
              .replace(/æ/g, "ae")
              .replace(/œ/g, "oe")
              .replace(/[^a-z0-9]/g, "");
          }

          function aantalRaketten(aantal) {

            const n = Math.floor(Number(aantal));

            if (!Number.isFinite(n) || n <= 0) {
              return 0;
            }

            return Math.max(
              1,
              Math.ceil((n + 50) / 100)
            );

          }

          function seconden(ms) {

            return Number(
              (ms / 1000).toFixed(3)
            );

          }

          function rondAf(waarde, decimalen = 2) {

            return Number(
              Number(waarde).toFixed(decimalen)
            );

          }

          function maakJSON(object) {

            return JSON.stringify(object);

          }

          function schrijfJSON(bestand, object) {

            const inhoud = maakJSON(object);

            fs.writeFileSync(
              bestand,
              inhoud,
              "utf8"
            );

            return Buffer.byteLength(
              inhoud,
              "utf8"
            );

          }

          function leesJSON(bestand) {

            return JSON.parse(
              fs.readFileSync(
                bestand,
                "utf8"
              )
            );

          }

          function veiligeLijst(waarde) {

            return Array.isArray(waarde)
              ? waarde
              : [];

          }

          function leesDebugLijst(
            debug,
            naam,
            verplicht = false
          ) {

            if (
              typeof debug?.[naam] !== "function"
            ) {

              const melding =
                `Debugfunctie ${naam} ontbreekt.`;

              if (verplicht) {

                fouten.push(melding);

              } else {

                waarschuwingen.push(melding);

              }

              return [];

            }

            try {

              const resultaat =
                debug[naam]();

              if (!Array.isArray(resultaat)) {

                throw new Error(
                  "Resultaat is geen lijst."
                );

              }

              return JSON.parse(
                JSON.stringify(resultaat)
              );

            } catch (fout) {

              const melding =
                `${naam}: ${fout.message}`;

              if (verplicht) {

                fouten.push(melding);

              } else {

                waarschuwingen.push(melding);

              }

              return [];

            }

          }

          // ====================================================
          // JAVASCRIPT-OMGEVING VOOR DE DIERDATABASE
          // ====================================================

          const stilConsole = {

            log() {},

            info() {},

            debug() {},

            table() {},

            group() {},

            groupCollapsed() {},

            groupEnd() {},

            time() {},

            timeEnd() {},

            warn() {},

            error() {}

          };

          const context = vm.createContext({

            console: stilConsole,

            performance

          });

          context.window = context;
          context.self = context;

          // ====================================================
          // BRONBESTANDEN LADEN
          // ====================================================

          function laadBestand(bestand) {

            if (!fs.existsSync(bestand)) {

              throw new Error(
                `Bronbestand ontbreekt: ${bestand}`
              );

            }

            const start = performance.now();

            const code = fs.readFileSync(
              bestand,
              "utf8"
            );

            console.log("");
            console.log(
              `Bezig met verwerken: ${bestand}`
            );

            console.log(
              `Bestandsgrootte: ${
                rondAf(
                  Buffer.byteLength(code, "utf8") / 1024,
                  1
                )
              } KB`
            );

            try {

              vm.runInContext(

                code,

                context,

                {

                  filename: bestand,

                  timeout: 1200000

                }

              );

            } catch (fout) {

              console.error("");
              console.error(
                `FOUT IN BESTAND: ${bestand}`
              );

              console.error(
                fout.stack || fout.message
              );

              throw fout;

            }

            const duur = seconden(
              performance.now() - start
            );

            tijden[bestand] = duur;

            console.log(
              `${bestand} verwerkt in ${duur} seconden.`
            );

            const categorie =
              context.QB_V9_CATEGORIEEN?.Dieren;

            if (categorie) {

              console.log(
                `Actieve dataversie: ${categorie.version}`
              );

              console.log(
                `Bruikbare records: ${
                  categorie.summary?.bruikbareDierrecords ??
                  "Onbekend"
                }`
              );

              console.log(
                `Antwoordkoppelingen: ${
                  categorie.summary?.totaalVraagAntwoorden ??
                  "Onbekend"
                }`
              );

            }

          }

          console.log(
            "=========================================="
          );

          console.log(
            "QUIZBALLON V9.2 - DIEREN BOUWEN"
          );

          console.log(
            "=========================================="
          );

          for (const bestand of BRONBESTANDEN) {

            laadBestand(bestand);

          }

          // ====================================================
          // DEFINITIEVE EXPORT OPHALEN
          // ====================================================

          const categorie =
            context.QB_V9_CATEGORIEEN?.Dieren;

          const debug =
            context.QB_V9_DIeren_DEBUG;

          if (!categorie) {

            throw new Error(
              "De Dieren-categorie is niet geëxporteerd."
            );

          }

          if (!debug) {

            throw new Error(
              "De debugfuncties ontbreken."
            );

          }

          if (
            categorie.version !== VERWACHTE_VERSIE
          ) {

            throw new Error(

              `Verwacht versie ${VERWACHTE_VERSIE}, ` +

              `maar gevonden ${categorie.version}.`

            );

          }

          if (
            !Array.isArray(categorie.questions)
          ) {

            throw new Error(
              "De geëxporteerde vragenlijst ontbreekt."
            );

          }

          const vragen = JSON.parse(

            JSON.stringify(
              categorie.questions
            )

          );

          vragen.sort(

            (a, b) =>

              Number(a.questionNumber) -
              Number(b.questionNumber)

          );

          if (vragen.length !== 50) {

            fouten.push(

              `Verwacht 50 vragen, gevonden ${vragen.length}.`

            );

          }

          // ====================================================
          // VRAGEN EN ANTWOORDEN CONTROLEREN
          // ====================================================

          console.log("");
          console.log(
            "Alle geëxporteerde vragen controleren..."
          );

          const uniekeDieren = new Set();

          const uniekeVraagIds = new Set();

          const uniekeVraagnummers = new Set();

          let totaalAntwoorden = 0;

          let totaalRaketten = 0;

          let totaalAliassen = 0;

          let vragenMet1000 = 0;

          let begrensdeVoortgang = 0;

          let ontbrekendTotStreefdoel = 0;

          const vraagRapport = [];

          for (const vraag of vragen) {

            const nummer =
              Number(vraag.questionNumber);

            if (
              !Number.isInteger(nummer) ||
              nummer < 1 ||
              nummer > 50
            ) {

              fouten.push(
                `Ongeldig vraagnummer: ${nummer}`
              );

              continue;

            }

            if (
              uniekeVraagnummers.has(nummer)
            ) {

              fouten.push(
                `Dubbel vraagnummer: ${nummer}`
              );

            }

            uniekeVraagnummers.add(nummer);

            if (
              typeof vraag.id !== "string" ||
              !vraag.id.trim()
            ) {

              fouten.push(
                `Vraag ${nummer} heeft geen geldige ID.`
              );

            }

            if (
              uniekeVraagIds.has(vraag.id)
            ) {

              fouten.push(
                `Dubbele vraag-ID: ${vraag.id}`
              );

            }

            uniekeVraagIds.add(vraag.id);

            if (
              typeof vraag.question !== "string" ||
              !vraag.question.trim()
            ) {

              fouten.push(
                `Vraag ${nummer} heeft geen vraagtekst.`
              );

            }

            if (
              !Array.isArray(vraag.answers) ||
              vraag.answers.length === 0
            ) {

              fouten.push(
                `Vraag ${nummer} heeft geen antwoorden.`
              );

              continue;

            }

            const gezien = new Set();

            let raketten = 0;

            for (
              const antwoord of vraag.answers
            ) {

              const naam = antwoord.answer;

              const sleutel = normaliseer(naam);

              if (
                typeof naam !== "string" ||
                !sleutel
              ) {

                fouten.push(
                  `Vraag ${nummer}: ongeldige diernaam.`
                );

                continue;

              }

              if (gezien.has(sleutel)) {

                fouten.push(

                  `Vraag ${nummer}: dubbel antwoord ${naam}.`

                );

              }

              gezien.add(sleutel);

              uniekeDieren.add(sleutel);

              if (
                !Number.isInteger(antwoord.points) ||
                antwoord.points < 10 ||
                antwoord.points > 100
              ) {

                fouten.push(

                  `Vraag ${nummer}: ongeldige punten bij ${naam}.`

                );

              }

              if (
                antwoord.isRocket !==
                (antwoord.points === 100)
              ) {

                fouten.push(

                  `Vraag ${nummer}: onjuiste raketstatus bij ${naam}.`

                );

              }

              if (antwoord.isRocket) {

                raketten++;

              }

              if (
                !Array.isArray(antwoord.aliases)
              ) {

                fouten.push(

                  `Vraag ${nummer}: ongeldige aliaslijst bij ${naam}.`

                );

              } else {

                for (
                  const alias of antwoord.aliases
                ) {

                  if (
                    typeof alias !== "string" ||
                    !normaliseer(alias)
                  ) {

                    fouten.push(

                      `Vraag ${nummer}: ongeldige alias bij ${naam}.`

                    );

                  }

                }

                totaalAliassen +=
                  antwoord.aliases.length;

              }

            }

            const aantal =
              vraag.answers.length;

            const verwachteRaketten =
              aantalRaketten(aantal);

            if (
              raketten !== verwachteRaketten
            ) {

              fouten.push(

                `Vraag ${nummer}: ${raketten} raketten ` +

                `in plaats van ${verwachteRaketten}.`

              );

            }

            if (
              vraag.answerCount !== aantal
            ) {

              fouten.push(

                `Vraag ${nummer}: answerCount klopt niet.`

              );

            }

            if (
              vraag.rocketCount !== raketten
            ) {

              fouten.push(

                `Vraag ${nummer}: rocketCount klopt niet.`

              );

            }

            totaalAntwoorden += aantal;

            totaalRaketten += raketten;

            begrensdeVoortgang +=
              Math.min(aantal, 1000);

            ontbrekendTotStreefdoel +=
              Math.max(0, 1000 - aantal);

            if (aantal >= 1000) {

              vragenMet1000++;

            }

            vraagRapport.push({

              vraag: nummer,

              vraagtekst: vraag.question,

              antwoorden: aantal,

              raketten,

              tekort: Math.max(
                0,
                1000 - aantal
              )

            });

            console.log(

              `Vraag ${String(nummer).padStart(2, "0")}: ` +

              `${aantal} antwoorden, ${raketten} raketten.`

            );

          }

          for (
            let nummer = 1;
            nummer <= 50;
            nummer++
          ) {

            if (
              !uniekeVraagnummers.has(nummer)
            ) {

              fouten.push(
                `Vraag ${nummer} ontbreekt.`
              );

            }

          }

          // ====================================================
          // ANTWOORDTESTS OPHALEN
          // ====================================================

          const tests = leesDebugLijst(

            debug,

            "tests",

            true

          );

          const raketTests = leesDebugLijst(

            debug,

            "raketTests",

            true

          );

          const letterTests = leesDebugLijst(

            debug,

            "letterTests",

            true

          );

          const letterBankTests = leesDebugLijst(

            debug,

            "letterBankTests",

            true

          );

          const exportFouten = leesDebugLijst(

            debug,

            "fouten",

            true

          );

          const naamconflicten = leesDebugLijst(

            debug,

            "naamconflicten"

          );

          const ontbrekendeNamen = leesDebugLijst(

            debug,

            "ontbrekendeNamen"

          );

          const ontbrekendeKoppelingen =
            leesDebugLijst(

              debug,

              "ontbrekendeKoppelingen"

            );

          const overgeslagenConflicten =
            leesDebugLijst(

              debug,

              "overgeslagenConflicten"

            );

          const bronWaarschuwingen =
            leesDebugLijst(

              debug,

              "waarschuwingen"

            );

          const dubbeleNamen = leesDebugLijst(

            debug,

            "dubbeleNamen"

          );

          // ====================================================
          // TESTRESULTATEN VERWERKEN
          // ====================================================

          function controleerTests(
            naam,
            lijst
          ) {

            if (lijst.length === 0) {

              fouten.push(

                `${naam}: er zijn geen tests uitgevoerd.`

              );

            }

            const geslaagd = lijst.filter(

              test => test.geslaagd === true

            ).length;

            const mislukt = lijst.filter(

              test => test.geslaagd !== true

            );

            console.log(

              `${naam}: ${geslaagd}/${lijst.length} geslaagd.`

            );

            for (const test of mislukt) {

              const melding =

                `${naam} mislukt: ` +

                JSON.stringify(test);

              fouten.push(melding);

              console.error(melding);

            }

            return {

              geslaagd,

              totaal: lijst.length,

              mislukt

            };

          }

          console.log("");
          console.log(
            "=========================================="
          );

          console.log("TESTRESULTATEN");

          console.log(
            "=========================================="
          );

          const antwoordResultaat =
            controleerTests(

              "Antwoordtests",

              tests

            );

          const raketResultaat =
            controleerTests(

              "Rakettests",

              raketTests

            );

          const letterResultaat =
            controleerTests(

              "Lettertests",

              letterTests

            );

          const letterBankResultaat =
            controleerTests(

              "Letterbanktests",

              letterBankTests

            );

          // ====================================================
          // EXTRA ONAFHANKELIJKE RAKETTESTS
          // ====================================================

          const extraRaketTests = [

            [0,0],

            [1,1],

            [50,1],

            [51,2],

            [150,2],

            [151,3],

            [250,3],

            [251,4],

            [350,4],

            [351,5],

            [950,10],

            [951,11],

            [1000,11],

            [1050,11],

            [1051,12],

            [5000,51],

            [10000,101]

          ];

          for (
            const [aantal, verwacht] of
            extraRaketTests
          ) {

            const resultaat =
              aantalRaketten(aantal);

            if (resultaat !== verwacht) {

              fouten.push(

                `Onafhankelijke rakettest mislukt: ` +

                `${aantal} antwoorden, ` +

                `${resultaat} in plaats van ${verwacht}.`

              );

            }

          }

          // ====================================================
          // EXPORTSTATISTIEKEN VERGELIJKEN
          // ====================================================

          const bronSamenvatting =
            categorie.summary || {};

          function vergelijkStatistiek(
            naam,
            verwacht,
            gevonden
          ) {

            if (verwacht !== gevonden) {

              fouten.push(

                `${naam}: export vermeldt ${verwacht}, ` +

                `bouwcontrole vindt ${gevonden}.`

              );

            }

          }

          vergelijkStatistiek(

            "Bruikbare dierrecords",

            bronSamenvatting.bruikbareDierrecords,

            uniekeDieren.size

          );

          vergelijkStatistiek(

            "Antwoordkoppelingen",

            bronSamenvatting.totaalVraagAntwoorden,

            totaalAntwoorden

          );

          vergelijkStatistiek(

            "Raketten",

            bronSamenvatting.totaalRaketten,

            totaalRaketten

          );

          vergelijkStatistiek(

            "Aantal vragen",

            bronSamenvatting.totaalVragen,

            vragen.length

          );

          vergelijkStatistiek(

            "Vragen met minimaal 1000 antwoorden",

            bronSamenvatting.vragenMet1000Antwoorden,

            vragenMet1000

          );

          if (
            categorie.technicallyReady !== true
          ) {

            fouten.push(

              "De V9.2-database meldt dat de technische " +

              "controle nog niet volledig geslaagd is."

            );

          }

          for (const fout of exportFouten) {

            fouten.push(

              typeof fout === "string"

                ? fout

                : JSON.stringify(fout)

            );

          }

          for (
            const waarschuwing of
            bronWaarschuwingen
          ) {

            waarschuwingen.push(

              typeof waarschuwing === "string"

                ? waarschuwing

                : JSON.stringify(waarschuwing)

            );

          }

          // ====================================================
          // VOORTGANG BEREKENEN
          // ====================================================

          const voortgang = rondAf(

            begrensdeVoortgang /
            50000 * 100

          );

          const basisStatistieken = {

            uniqueAnimals:
              uniekeDieren.size,

            questionCount:
              vragen.length,

            answerCount:
              totaalAntwoorden,

            rocketCount:
              totaalRaketten,

            aliasLinks:
              totaalAliassen,

            completedQuestions:
              vragenMet1000,

            incompleteQuestions:
              50 - vragenMet1000,

            progress:
              voortgang,

            missingToTarget:
              ontbrekendTotStreefdoel,

            passedTests:
              antwoordResultaat.geslaagd,

            totalTests:
              antwoordResultaat.totaal,

            passedRocketTests:
              raketResultaat.geslaagd,

            totalRocketTests:
              raketResultaat.totaal,

            passedLetterTests:
              letterResultaat.geslaagd,

            totalLetterTests:
              letterResultaat.totaal,

            passedLetterBankTests:
              letterBankResultaat.geslaagd,

            totalLetterBankTests:
              letterBankResultaat.totaal,

            conflicts:
              naamconflicten.length,

            warnings:
              waarschuwingen.length,

            newAnimals:

              uniekeDieren.size -
              BASISLIJN.uniekeDieren,

            newAnswerLinks:

              totaalAntwoorden -
              BASISLIJN.antwoorden,

            newRockets:

              totaalRaketten -
              BASISLIJN.raketten,

            progressDifference:

              rondAf(
                voortgang -
                BASISLIJN.voortgang
              )

          };

          // ====================================================
          // UITGEBREID BOUWRAPPORT
          // ====================================================

          const controleRapport = {

            version:
              categorie.version,

            category: "Dieren",

            baseline:
              BASISLIJN,

            timings:
              tijden,

            summary:
              basisStatistieken,

            sourceSummary:
              bronSamenvatting,

            tests:
              tests,

            rocketTests:
              raketTests,

            letterTests:
              letterTests,

            letterBankTests:
              letterBankTests,

            failedTests:
              antwoordResultaat.mislukt,

            failedRocketTests:
              raketResultaat.mislukt,

            failedLetterTests:
              letterResultaat.mislukt,

            failedLetterBankTests:
              letterBankResultaat.mislukt,

            missingNames:
              ontbrekendeNamen,

            missingLinks:
              ontbrekendeKoppelingen,

            conflicts:
              naamconflicten,

            skippedConflicts:
              overgeslagenConflicten,

            duplicateNames:
              dubbeleNamen,

            warnings:
              waarschuwingen,

            exportErrors:
              fouten,

            questions:
              vraagRapport,

            contentVerified: false,

            contentComplete: false,

            buildVerified:
              fouten.length === 0,

            totalBuildSeconds:

              seconden(

                performance.now() -
                bouwStart

              )

          };

          // ====================================================
          // RAPPORT ALTIJD BEWAREN
          // ====================================================

          // Ook wanneer een test mislukt blijft dit
          // rapport beschikbaar als GitHub-artifact.

          fs.mkdirSync(

            "bouwrapport",

            { recursive: true }

          );

          schrijfJSON(

            "bouwrapport/controle.json",

            controleRapport

          );

          const uniekeFouten = [

            ...new Set(fouten)

          ];

          // ====================================================
          // EINDRESULTATEN TONEN
          // ====================================================

          console.log("");
          console.log(
            "=========================================="
          );

          console.log(
            "QUIZBALLON DIEREN V9.2 - RESULTATEN"
          );

          console.log(
            "=========================================="
          );

          console.log(
            `Versie: ${categorie.version}`
          );

          console.log(
            `Unieke diernamen: ${uniekeDieren.size}`
          );

          console.log(
            `Nieuwe diernamen: ${
