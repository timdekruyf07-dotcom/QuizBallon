          console.log(
            `Voortgang: ${voortgang}%`
          );

          console.log(
            `Vorige voortgang: ${
              BASISLIJN.voortgang
            }%`
          );

          console.log(
            `Verschil: ${
              basisStatistieken.progressDifference
            } procentpunten`
          );

          console.log(
            `Ontbrekend tot streefdoel: ${
              ontbrekendTotStreefdoel
            }`
          );

          console.log(
            `Naamconflicten: ${
              naamconflicten.length
            }`
          );

          console.log(
            `Waarschuwingen: ${
              waarschuwingen.length
            }`
          );

          console.log(
            `Technische fouten: ${
              uniekeFouten.length
            }`
          );

          console.log(
            "Biologisch onafhankelijk gecontroleerd: Nee"
          );

          // ====================================================
          // STOPPEN BIJ MISLUKTE TESTS
          // ====================================================

          if (uniekeFouten.length > 0) {

            console.error("");
            console.error(
              "=========================================="
            );

            console.error(
              "DE DATABASE HEEFT DE CONTROLE NIET DOORSTAAN"
            );

            console.error(
              "=========================================="
            );

            for (const fout of uniekeFouten) {

              console.error(`- ${fout}`);

            }

            console.error("");

            console.error(

              "De bestaande werkende V9.1-JSON-bestanden " +

              "worden niet vervangen."

            );

            throw new Error(

              `${uniekeFouten.length} technische fouten gevonden.`

            );

          }

          // ====================================================
          // JSON-BESTANDEN GENEREREN
          // ====================================================

          console.log("");
          console.log(
            "Alle technische controles zijn geslaagd."
          );

          console.log(
            "De 50 afzonderlijke vraagbanken genereren..."
          );

          fs.mkdirSync(

            UITVOERMAP,

            { recursive: true }

          );

          const manifestVragen = [];

          let totaalBytes = 0;

          for (const vraag of vragen) {

            const nummer =
              vraag.questionNumber;

            const bestandsnaam =

              String(nummer)

                .padStart(2, "0") +

              ".json";

            const bestand = path.join(

              UITVOERMAP,

              bestandsnaam

            );

            const bytes = schrijfJSON(

              bestand,

              vraag

            );

            totaalBytes += bytes;

            manifestVragen.push({

              id:
                vraag.id,

              baseQuestionId:

                vraag.baseQuestionId ||
                vraag.id,

              topicId:

                vraag.topicId ||
                vraag.id,

              questionNumber:
                nummer,

              question:
                vraag.question,

              category:
                vraag.category,

              qb650Category:
                "Dieren",

              hint:
                vraag.hint || "",

              answerCount:
                vraag.answers.length,

              rocketCount:
                vraag.rocketCount,

              file:
                bestandsnaam,

              bytes

            });

            console.log(

              `${bestandsnaam}: ` +

              `${vraag.answers.length} antwoorden, ` +

              `${rondAf(bytes / 1024, 1)} KB.`

            );

          }

          // ====================================================
          // MANIFEST MAKEN
          // ====================================================

          const manifest = {

            version:
              categorie.version,

            category:
              "Dieren",

            contentVerified:
              false,

            contentComplete:
              false,

            buildVerified:
              true,

            summary: {

              ...basisStatistieken,

              totalBytes:
                totaalBytes,

              averageQuestionBytes:

                Math.round(

                  totaalBytes /
                  vragen.length

                )

            },

            questions:
              manifestVragen

          };

          schrijfJSON(

            path.join(

              UITVOERMAP,

              "manifest.json"

            ),

            manifest

          );

          // ====================================================
          // GEGENEREERDE BESTANDEN OPNIEUW CONTROLEREN
          // ====================================================

          console.log("");
          console.log(
            "Gegenereerde bestanden opnieuw inlezen..."
          );

          const teruggelezenManifest =
            leesJSON(

              path.join(

                UITVOERMAP,

                "manifest.json"

              )

            );

          if (
            teruggelezenManifest.version !==
            VERWACHTE_VERSIE
          ) {

            throw new Error(

              "De versie in manifest.json klopt niet."

            );

          }

          if (
            teruggelezenManifest.questions.length !== 50
          ) {

            throw new Error(

              "Het manifest bevat geen 50 vragen."

            );

          }

          let controleAntwoorden = 0;

          let controleRaketten = 0;

          let controleBytes = 0;

          const controleDieren = new Set();

          for (
            const metadata of
            teruggelezenManifest.questions
          ) {

            const bestand = path.join(

              UITVOERMAP,

              metadata.file

            );

            const gegevens =
              leesJSON(bestand);

            const bestandsgrootte =
              fs.statSync(bestand).size;

            if (
              gegevens.id !== metadata.id
            ) {

              throw new Error(

                `Vraag-ID klopt niet in ${metadata.file}.`

              );

            }

            if (
              gegevens.questionNumber !==
              metadata.questionNumber
            ) {

              throw new Error(

                `Vraagnummer klopt niet in ${metadata.file}.`

              );

            }

            if (
              gegevens.dataVersion !==
              VERWACHTE_VERSIE
            ) {

              throw new Error(

                `Dataversie klopt niet in ${metadata.file}.`

              );

            }

            if (
              gegevens.answers.length !==
              metadata.answerCount
            ) {

              throw new Error(

                `Antwoordaantal klopt niet in ${metadata.file}.`

              );

            }

            const raketten =
              gegevens.answers.filter(

                antwoord =>
                  antwoord.isRocket === true

              ).length;

            if (
              raketten !== metadata.rocketCount
            ) {

              throw new Error(

                `Raketaantal klopt niet in ${metadata.file}.`

              );

            }

            if (
              bestandsgrootte !== metadata.bytes
            ) {

              throw new Error(

                `Bestandsgrootte klopt niet in ${metadata.file}.`

              );

            }

            controleAntwoorden +=
              gegevens.answers.length;

            controleRaketten +=
              raketten;

            controleBytes +=
              bestandsgrootte;

            for (
              const antwoord of gegevens.answers
            ) {

              controleDieren.add(

                normaliseer(antwoord.answer)

              );

            }

          }

          if (
            controleAntwoorden !== totaalAntwoorden
          ) {

            throw new Error(

              "Tijdens de export zijn antwoorden verloren gegaan."

            );

          }

          if (
            controleRaketten !== totaalRaketten
          ) {

            throw new Error(

              "Tijdens de export zijn raketten verloren gegaan."

            );

          }

          if (
            controleDieren.size !== uniekeDieren.size
          ) {

            throw new Error(

              "Tijdens de export zijn diernamen verloren gegaan."

            );

          }

          if (
            controleBytes !== totaalBytes
          ) {

            throw new Error(

              "De totale JSON-bestandsgrootte klopt niet."

            );

          }

          // ====================================================
          // DEFINITIEF CONTROLERAPPORT OPSLAAN
          // ====================================================

          controleRapport.summary =
            manifest.summary;

          controleRapport.buildVerified =
            true;

          controleRapport.totalBuildSeconds =
            seconden(

              performance.now() -
              bouwStart

            );

          controleRapport.exportErrors = [];

          schrijfJSON(

            path.join(

              UITVOERMAP,

              "controle.json"

            ),

            controleRapport

          );

          schrijfJSON(

            "bouwrapport/controle.json",

            controleRapport

          );

          // ====================================================
          // GITHUB SAMENVATTING
          // ====================================================

          if (
            process.env.GITHUB_STEP_SUMMARY
          ) {

            const regels = [

              "# QuizBallon Dieren V9.2",

              "",

              "Alle technische controles zijn geslaagd.",

              "",

              "| Onderdeel | V9.1 | V9.2 |",

              "|---|---:|---:|",

              `| Diernamen | ${BASISLIJN.uniekeDieren} | ${uniekeDieren.size} |`,

              `| Antwoordkoppelingen | ${BASISLIJN.antwoorden} | ${totaalAntwoorden} |`,

              `| Raketten | ${BASISLIJN.raketten} | ${totaalRaketten} |`,

              `| Vragen met 1000+ antwoorden | ${BASISLIJN.vragenMet1000} | ${vragenMet1000} |`,

              `| Voortgang | ${BASISLIJN.voortgang}% | ${voortgang}% |`,

              "",

              "## Tests",

              "",

              `- Antwoordtests: ${antwoordResultaat.geslaagd}/${antwoordResultaat.totaal}`,

              `- Rakettests: ${raketResultaat.geslaagd}/${raketResultaat.totaal}`,

              `- Lettertests: ${letterResultaat.geslaagd}/${letterResultaat.totaal}`,

              `- Letterbanktests: ${letterBankResultaat.geslaagd}/${letterBankResultaat.totaal}`,

              "",

              "## Prestaties",

              "",

              `- Totale JSON-grootte: ${rondAf(totaalBytes / 1024 / 1024)} MB`,

              `- Gemiddelde vraaggrootte: ${rondAf(totaalBytes / 50 / 1024, 1)} KB`,

              `- Totale bouwtijd: ${controleRapport.totalBuildSeconds} seconden`,

              "",

              "## Alle 50 vragen",

              "",

              "| Vraag | Antwoorden | Raketten | Tekort tot 1000 |",

              "|---:|---:|---:|---:|"

            ];

            for (const vraag of vraagRapport) {

              regels.push(

                `| ${vraag.vraag} | ${vraag.antwoorden} | ${vraag.raketten} | ${vraag.tekort} |`

              );

            }

            regels.push(

              "",

              "Biologische volledigheid is niet onafhankelijk vastgesteld."

            );

            fs.appendFileSync(

              process.env.GITHUB_STEP_SUMMARY,

              regels.join("\n") + "\n"

            );

          }

          // ====================================================
          // EINDE BOUWPROCES
          // ====================================================

          console.log("");
          console.log(
            "=========================================="
          );

          console.log(
            "QUIZBALLON V9.2 SUCCESVOL GEBOUWD"
          );

          console.log(
            "=========================================="
          );

          console.log(
            `Versie: ${manifest.version}`
          );

          console.log(
            `Vraagbestanden: ${vragen.length}`
          );

          console.log(
            `Diernamen: ${uniekeDieren.size}`
          );

          console.log(
            `Antwoordkoppelingen: ${totaalAntwoorden}`
          );

          console.log(
            `Raketten: ${totaalRaketten}`
          );

          console.log(

            `Totale JSON-grootte: ${

              rondAf(
                totaalBytes / 1024 / 1024
              )

            } MB`

          );

          console.log(

            `Gemiddelde vraaggrootte: ${

              rondAf(
                totaalBytes / 50 / 1024,
                1
              )

            } KB`

          );

          console.log(
            `Voortgang: ${voortgang}%`
          );

          console.log(

            `Totale bouwtijd: ${

              controleRapport.totalBuildSeconds

            } seconden.`

          );

          console.log(
            "Technisch gereed: Ja"
          );

          console.log(
            "Biologisch onafhankelijk gecontroleerd: Nee"
          );

          NODE

      # ========================================================
      # BOUWRAPPORT BESCHIKBAAR MAKEN
      # ========================================================

      - name: Bouwrapport bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizballon-dieren-v92-bouwrapport
          path: bouwrapport/
          if-no-files-found: ignore
          retention-days: 14

      # ========================================================
      # GEGENEREERDE BESTANDEN CONTROLEREN
      # ========================================================

      - name: Gegenereerde bestanden controleren
        shell: bash
        run: |
          echo "Controleren of alle JSON-bestanden bestaan..."

          test -f antwoorden/gebouwd/dieren/manifest.json
          test -f antwoorden/gebouwd/dieren/controle.json

          for nummer in $(seq -w 1 50); do
            test -f "antwoorden/gebouwd/dieren/${nummer}.json"
          done

          echo ""
          echo "Alle 52 vereiste bestanden zijn aanwezig."

          du -sh antwoorden/gebouwd/dieren/

      # ========================================================
      # GEGENEREERDE BESTANDEN OPSLAAN
      # ========================================================

      - name: Gegenereerde bestanden opslaan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add antwoorden/gebouwd/dieren/

          if git diff --cached --quiet; then

            echo "Geen gewijzigde bestanden."

          else

            git commit -m "Bouw QuizBallon Dieren V9.2 antwoordbestanden"

            git push

          fi

      # ========================================================
      # SUCCESMELDING
      # ========================================================

      - name: Bouwproces afgerond
        shell: bash
        run: |
          echo "=========================================="
          echo "QUIZBALLON DIEREN V9.2 IS GEBOUWD"
          echo "=========================================="
          echo ""
          echo "50 afzonderlijke vraagbanken."
          echo "1 manifestbestand."
          echo "1 controlerapport."
          echo ""
          echo "De snelle laadstructuur blijft behouden."
          echo "De actieve V8-game is niet gewijzigd."
          echo ""
          echo "Testpagina:"
          echo "https://timdekruyf07-dotcom.github.io/QuizBallon/test-dieren-snel.html"
